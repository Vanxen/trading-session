<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psychology Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mute:#5d6b82;--line:#dde3ec;--win:#0b9a6a;--winbg:#dff5ec;--loss:#d83a46;--lossbg:#fbe4e6;--acc:#3451d1;--accbg:#e4e9fb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--ink:#eaf0fa;--mute:#93a1ba;--line:#2a3548;--win:#34d399;--winbg:#12382c;--loss:#ff6b76;--lossbg:#3f1a21;--acc:#8ea2ff;--accbg:#1f2a52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--ink:#eaf0fa;--mute:#93a1ba;--line:#2a3548;--win:#34d399;--winbg:#12382c;--loss:#ff6b76;--lossbg:#3f1a21;--acc:#8ea2ff;--accbg:#1f2a52;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:14px}
h1,h2,.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:15px;margin:0;font-weight:600;color:var(--mute)}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.hero{padding:22px 18px}
.bal{font-size:clamp(44px,15vw,68px);font-weight:800;line-height:1;margin:6px 0 10px}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.pill.up{background:var(--winbg);color:var(--win)}.pill.down{background:var(--lossbg);color:var(--loss)}.pill.flat{background:var(--accbg);color:var(--acc)}
.sub{color:var(--mute);font-size:14px}
.goals{display:grid;gap:16px}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.goal .row b{font-size:17px}
.track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.fill.hit{background:var(--win)}.fill.neg{background:var(--loss)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:2px solid var(--line);background:transparent;color:var(--mute);border-radius:14px;padding:14px;font:700 17px "Bricolage Grotesque",Figtree,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"].p{border-color:var(--win);background:var(--winbg);color:var(--win)}
.seg button[aria-pressed="true"].l{border-color:var(--loss);background:var(--lossbg);color:var(--loss)}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.f .wide{grid-column:1/-1}
.add{width:100%;border:0;border-radius:14px;padding:14px;font:700 16px Figtree,sans-serif;color:#fff;background:var(--acc);cursor:pointer}
.add.p{background:var(--win)}.add.l{background:var(--loss)}
.day{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.day:first-of-type{border-top:0;margin-top:0;padding-top:0}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dh b{font-size:15px}.dh span{font-weight:700}
.t{display:flex;align-items:center;gap:10px;padding:8px 0}
.t .tag{font-size:12px;font-weight:700;border-radius:8px;padding:2px 9px}
.tag.p{background:var(--winbg);color:var(--win)}.tag.l{background:var(--lossbg);color:var(--loss)}
.t .n{flex:1;color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .a{font-weight:700}
.t .x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:2px 6px}
.win{color:var(--win)}.lose{color:var(--loss)}
.levels{display:flex;flex-wrap:wrap;gap:8px}
.lv{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute)}
.lv.done{background:var(--winbg);border-color:var(--win);color:var(--win);font-weight:600}
.empty{color:var(--mute);margin:0}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:12px}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Psychology Challenge</h1><button class="icon" id="theme" type="button">Theme</button></div>
  <section class="card hero" id="hero"></section>
  <section class="card goals" id="goals"></section>
  <section class="card">
    <h2>Log a trade</h2>
    <div class="seg" role="group" aria-label="Trade result">
      <button type="button" class="p" id="bp" aria-pressed="true">Profit</button>
      <button type="button" class="l" id="bl" aria-pressed="false">Loss</button>
    </div>
    <div class="f">
      <div><label for="amt">Amount ($)</label><input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div class="wide"><label for="note">Note (optional)</label><input id="note" type="text" placeholder="What did you feel or follow?"></div>
    </div>
    <button class="add p" id="add" type="button">Add profit</button>
    <p class="sub" id="msg" role="status" style="margin:8px 0 0"></p>
  </section>
  <section class="card"><h2>Daily log</h2><div id="log"></div></section>
  <section class="card"><h2>Levels</h2><div class="levels" id="levels"></div></section>
  <details class="card"><summary>Settings and backup</summary>
    <div class="f">
      <div><label for="sb">Starting balance</label><input id="sb" type="number" inputmode="decimal"></div>
      <div><label for="dt">Daily target</label><input id="dt" type="number" inputmode="decimal"></div>
      <div class="wide"><label for="wg">Weekly goal</label><input id="wg" type="number" inputmode="decimal"></div>
    </div>
    <label for="json">Backup data (copy it, or paste a backup and load it)</label>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="btns">
      <button class="icon" id="copy" type="button">Copy backup</button>
      <button class="icon" id="load" type="button">Load pasted backup</button>
      <label class="icon" style="margin:0;cursor:pointer">Open backup file<input id="file" type="file" accept=".json,application/json" hidden></label>
      <button class="icon" id="reset" type="button">Clear all trades</button>
    </div>
  </details>
</main>
<script>
(function(){
var KEY="psych-challenge-v1";
var S={startingBalance:1000,dailyTarget:25,weeklyGoal:200,dayEntries:[],trades:[],completedLevels:[]};
var mode="profit";
var $=function(i){return document.getElementById(i)};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function restore(){try{var r=localStorage.getItem(KEY);if(r){merge(JSON.parse(r))}}catch(e){}}
function merge(o){
  if(!o||typeof o!=="object")throw new Error("bad");
  ["startingBalance","dailyTarget","weeklyGoal"].forEach(function(k){if(typeof o[k]==="number")S[k]=o[k]});
  ["dayEntries","trades","completedLevels"].forEach(function(k){if(Array.isArray(o[k]))S[k]=o[k]});
}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function today(){return iso(new Date())}
function weekStart(){var d=new Date();var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
function val(t){var a=Math.abs(Number(t.amount)||0);return t.result==="loss"?-a:a}
function money(n,sign){var s=Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?"-":(sign&&n>0?"+":""))+"$"+s}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sum(f){return S.trades.filter(f).reduce(function(a,t){return a+val(t)},0)}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0}
function render(){
  var total=sum(function(){return true}),bal=S.startingBalance+total;
  var td=sum(function(t){return t.date===today()}),ws=weekStart(),wk=sum(function(t){return t.date>=ws});
  var cls=total>0?"up":total<0?"down":"flat";
  $("hero").innerHTML='<div class="sub">Account balance</div><div class="num bal">'+money(bal)+'</div><span class="pill '+cls+'">'+(total===0?"No change yet":money(total,true)+" since start")+'</span><div class="sub" style="margin-top:10px">Started at '+money(S.startingBalance)+" · "+S.trades.length+" trade"+(S.trades.length===1?"":"s")+" logged</div>";
  function goal(name,v,t){var hit=v>=t&&t>0;return '<div class="goal"><div class="row"><span>'+name+'</span><span><b class="'+(v<0?"lose":hit?"win":"")+'">'+money(v,true)+'</b> of '+money(t)+'</span></div><div class="track"><div class="fill '+(hit?"hit":v<0?"neg":"")+'" style="width:'+(v<0?100:pct(v,t))+'%"></div></div></div>'}
  $("goals").innerHTML=goal("Today",td,S.dailyTarget)+goal("This week",wk,S.weeklyGoal);
  var by={};S.trades.forEach(function(t){(by[t.date]=by[t.date]||[]).push(t)});
  var days=Object.keys(by).sort().reverse();
  $("log").innerHTML=days.length?days.map(function(d){
    var ts=by[d].slice().sort(function(a,b){return b.id-a.id}),dv=ts.reduce(function(a,t){return a+val(t)},0);
    var nice=new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    return '<div class="day"><div class="dh"><b>'+nice+(d===today()?" (today)":"")+' <span class="sub">· '+ts.length+' trade'+(ts.length===1?"":"s")+'</span></b><span class="'+(dv<0?"lose":dv>0?"win":"")+'">'+money(dv,true)+'</span></div>'+ts.map(function(t){var p=t.result!=="loss";return '<div class="t"><span class="tag '+(p?"p":"l")+'">'+(p?"Profit":"Loss")+'</span><span class="n">'+esc(t.note)+'</span><span class="a '+(p?"win":"lose")+'">'+money(val(t),true)+'</span><button class="x" type="button" data-del="'+t.id+'" aria-label="Delete trade">×</button></div>'}).join("")+'</div>'
  }).join(""):'<p class="empty">No trades yet. Add your first one above and it will show up here by day.</p>';
  var done=[];$("levels").innerHTML=[1,2,3,4,5,6].map(function(n){var need=S.startingBalance+n*S.weeklyGoal,ok=bal>=need;if(ok)done.push(n);return '<div class="lv '+(ok?"done":"")+'">Level '+n+" · "+money(need)+'</div>'}).join("");
  S.completedLevels=done;
  $("json").value=JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString()}),null,2);
  $("sb").value=S.startingBalance;$("dt").value=S.dailyTarget;$("wg").value=S.weeklyGoal;
  save();
}
function setMode(m){mode=m;$("bp").setAttribute("aria-pressed",m==="profit");$("bl").setAttribute("aria-pressed",m==="loss");var a=$("add");a.className="add "+(m==="profit"?"p":"l");a.textContent=m==="profit"?"Add profit":"Add loss"}
$("bp").onclick=function(){setMode("profit")};$("bl").onclick=function(){setMode("loss")};
$("add").onclick=function(){
  var a=parseFloat($("amt").value),m=$("msg");
  if(!(a>0)){m.textContent="Enter an amount greater than 0.";$("amt").focus();return}
  S.trades.push({id:Date.now(),date:$("date").value||today(),result:mode,amount:Math.round(a*100)/100,note:$("note").value.trim()});
  $("amt").value="";$("note").value="";m.textContent=(mode==="profit"?"Profit":"Loss")+" added. Log another trade for the same day any time.";
  render();$("amt").focus();
};
$("log").onclick=function(e){var id=e.target.getAttribute&&e.target.getAttribute("data-del");if(id){S.trades=S.trades.filter(function(t){return String(t.id)!==id});render()}};
[["sb","startingBalance"],["dt","dailyTarget"],["wg","weeklyGoal"]].forEach(function(p){$(p[0]).onchange=function(){var v=parseFloat(this.value);if(v>=0){S[p[1]]=v}render()}});
$("copy").onclick=function(){$("json").select();try{navigator.clipboard.writeText($("json").value)}catch(e){}};
function loadText(t){try{merge(JSON.parse(t));$("msg").textContent="Backup loaded.";render()}catch(e){alert("That backup could not be read. Paste the full JSON text.")}}
$("load").onclick=function(){loadText($("json").value)};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){loadText(r.result)};r.readAsText(f)};
$("reset").onclick=function(){if(confirm("Delete every logged trade? This cannot be undone.")){S.trades=[];S.dayEntries=[];render()}};
$("theme").onclick=function(){var r=document.documentElement,d=getComputedStyle(r).colorScheme==="dark";r.setAttribute("data-theme",d?"light":"dark")};
$("date").value=today();
restore();render();
})();
</script>
</body>
</html>
